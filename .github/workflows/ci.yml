name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test offline
        run: python -m pytest
      - name: Smoke test gate, CSV, and inventory check
        run: |
          python -m patchorder inventory check examples/inventory.yaml
          python -m patchorder demo --format csv --output "$RUNNER_TEMP/findings.csv"
          set +e
          python -m patchorder demo --fail-on kev > /dev/null
          code=$?
          set -e
          test "$code" -eq 4
