name: Offline scan example

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements-ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Create offline CSV briefing
        run: |
          mkdir -p .tmp
          python -m patchorder scan -i examples/offline-scan/inventory.yaml -l examples/offline-scan/inventory.lock.yaml --offline --no-discover-cpes --pinned-only --cache-dir examples/offline-scan/cache --format csv --output .tmp/offline-findings.csv
      - name: Upload CSV briefing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offline-scan-findings
          path: .tmp/offline-findings.csv
          if-no-files-found: error
          retention-days: 7
